# Only read by Netlify. Routes the site's default contact endpoint to the function in netlify/functions,
# so NEXT_PUBLIC_CONTACT_ENDPOINT can stay at its default of /api/contact.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Two project slugs were renamed on 23 September 2026 (a typo fixed, and a title that had been wrong since the
# WordPress export). The site is a static export, so next.config redirects cannot do this; Netlify does.
